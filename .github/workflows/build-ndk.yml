name: Build jni (ZAGll)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "ndk;28.2.13676358"

      - name: ndk-build arm64
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
        run: |
          "$ANDROID_NDK_HOME/ndk-build" -j"$(nproc)"

      - name: Verify libZAGll.so
        run: |
          ls -la libs/arm64-v8a/libZAGll.so
          file libs/arm64-v8a/libZAGll.so | grep -i 'ELF.*aarch64'

      - uses: actions/upload-artifact@v4
        with:
          name: libZAGll-arm64
          path: libs/arm64-v8a/libZAGll.so
          if-no-files-found: error